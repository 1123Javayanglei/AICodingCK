<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据结构科目测试</title>
<link rel="stylesheet" href="../styles.css">
<script>try { localStorage.clear(); } catch (e) {}</script>
</head>
<body>
<div class="app" id="app"></div>
<script src="../questions.js"></script>
<script src="../explanations.js"></script>
<script src="../essay-rubrics.js"></script>
<script src="../dict.js"></script>
<script src="../app.js"></script>
<script>
(function () {
  const out = [];
  let pass = 0, fail = 0;
  function ok(cond, name, extra) {
    if (cond) { pass++; out.push('PASS  ' + name); }
    else { fail++; out.push('FAIL  ' + name + (extra != null ? '  → ' + extra : '')); }
  }
  function q(sel) { return document.querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function txt(sel) { const el = q(sel); return el ? el.textContent : null; }
  function click(sel) {
    const el = typeof sel === 'string' ? q(sel) : sel;
    if (!el) throw new Error('找不到元素: ' + sel);
    el.click();
    return el;
  }
  // 往输入框里打字: 应用只认 input 事件, 直接改 value 是不算数的
  function typeInto(el, value) {
    el.value = value;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function stat(i) { const els = qa('.stat b'); return els[i] ? els[i].textContent : null; }

  window.confirm = function () { return true; };
  window.alert = function () {};

  try {

  /* ---------- 1. 题库数据 ---------- */
  const BANK = window.QUESTION_BANKS['数据结构'];
  ok(!!BANK, '题库里有"数据结构"这个科目');
  const ALL = BANK.questions;
  function byId(id) { return ALL.filter(function (x) { return x.id === id; })[0]; }
  function byType(t) { return ALL.filter(function (x) { return x.type === t; }); }

  ok(ALL.length === 49, '共 49 题 (单选 20 + 填空 19 + 名词解释 10)', ALL.length);
  ok(byType('single').length === 20 && byType('blank').length === 19 && byType('term').length === 10,
    '题型分布 20/19/10',
    byType('single').length + '/' + byType('blank').length + '/' + byType('term').length);
  ok(BANK.types.map(function (t) { return t.name; }).join('/') === '单选题/填空题/名词解释',
    '题型表就这三种', BANK.types.map(function (t) { return t.name; }).join('/'));
  ok(BANK.settings.examEnabled === true, '设置行不再写"不加入模拟考试", 模拟考试开着');
  ok(BANK.settings.typeScores.single === 2 && BANK.settings.typeScores.blank === 2 &&
    BANK.settings.typeScores.term === 6, '设置行按题型给分 2/2/6',
    JSON.stringify(BANK.settings.typeScores));
  ok(BANK.settings.randomPick === 10, '设置行写了"随机抽 10 题"', BANK.settings.randomPick);
  ok(JSON.stringify(window.QUESTION_BANKS['english'].settings.typeScores) === '{}' &&
    !window.QUESTION_BANKS['english'].settings.randomPick,
    '英语的设置没被数据结构带跑',
    JSON.stringify(window.QUESTION_BANKS['english'].settings));

  const texts = byType('blank').concat(byType('term'));
  ok(texts.every(function (x) { return x.sub === 'text'; }), '填空/名词解释都是自评文字题');
  ok(texts.every(function (x) { return x.ref && x.ref.trim(); }), '文字题都有参考答案');
  ok(texts.every(function (x) { return x.options.length === 0 && x.answer === null; }),
    '文字题没有选项, 也没有 A-D 答案');
  ok(byType('single').every(function (x) { return x.options.length === 4 && x.answer != null; }),
    '单选题还是四个选项 + 答案');
  ok(byType('single').every(function (x) { return x.score === 2; }) &&
    byType('blank').every(function (x) { return x.score === 2; }) &&
    byType('term').every(function (x) { return x.score === 6; }),
    '分值: 单选 2 / 填空 2 / 名词解释 6',
    ALL.filter(function (x) { return x.score === 6; }).length + ' 道 6 分题');

  ok(byId('lx2-11').ref === 'n-i+1', '公式答案照抄 (n-i+1)', byId('lx2-11').ref);
  ok(byId('lx2-15').ref === '最大高度是 6、最小高度是 3', '两个空的答案都写全了', byId('lx2-15').ref);
  ok(byId('lx2-7').stem.indexOf('while (x < n / 2)') > 0, '程序片段接在题干后面', byId('lx2-7').stem);
  ok(byId('lx3-1').stem === '逻辑结构' && byId('lx3-1').ref.indexOf('存储结构') > 0,
    '名词解释: 题干是术语, 参考答案是定义');
  ok(byId('lx1-1').stem.indexOf('________') > 0, '选择题干里的空还在');

  /* ---------- 2. 首页: 模拟考试 + 练习 ---------- */
  ok(qa('.subject-tab').length === 2, '两个科目标签 (英语/数据结构)',
    qa('.subject-tab').map(function (x) { return x.textContent; }).join(','));
  click('[data-subject="数据结构"]');
  ok(txt('.hero h1') === '数据结构刷题', '切到数据结构', txt('.hero h1'));
  ok(txt('.hero p') === '单选题 / 填空题 / 名词解释 · 共 49 题 · 满分 138 分',
    '首页文案', txt('.hero p'));
  ok(!!q('[data-action="start-exam"]'), '摆出了模拟考试入口');
  ok(txt('.mode-card.primary .t') === '模拟考试', '模拟考试成了主入口', txt('.mode-card.primary .t'));
  ok(stat(0) === '49' && stat(1) === '0' && stat(2) === '—', '题库总数 / 错题本 / 最近得分',
    [stat(0), stat(1), stat(2)].join('/'));
  ok(!!q('[data-action="toggle-random"]') && qa('.mode-opt').some(function (el) {
    return el.textContent.indexOf('随机抽取 10 题') === 0;
  }), '有"随机抽取 10 题"勾选框 (设置行说了抽 10)');

  /* ---------- 3. 练习设置: 三个题型各一张卡 ---------- */
  click('[data-action="goto-practice"]');
  ok(qa('.type-card').length === 3, '三张题型卡 (没有写作)', qa('.type-card').length);
  ok(txt('[data-scope="type:single"] .t') === '单选题 · 全部 20 题', txt('[data-scope="type:single"] .t'));
  ok(txt('[data-scope="type:single"] .d') === '每题 2 分 · 满分 40 分', txt('[data-scope="type:single"] .d'));
  ok(txt('[data-scope="type:blank"] .t') === '填空题 · 全部 19 题', txt('[data-scope="type:blank"] .t'));
  ok(txt('[data-scope="type:blank"] .d') === '每题 2 分 · 满分 38 分', txt('[data-scope="type:blank"] .d'));
  ok(txt('[data-scope="type:term"] .t') === '名词解释 · 全部 10 题', txt('[data-scope="type:term"] .t'));
  ok(txt('[data-scope="type:term"] .d') === '每题 6 分 · 满分 60 分', txt('[data-scope="type:term"] .d'));
  ok(qa('.sub-row').length === 0, '每个题型只有一个分节, 不展开子行', qa('.sub-row').length);

  /* ---------- 4. 单选题: 答错回显正确答案 ---------- */
  click('[data-scope="type:single"]');
  ok(!!q('.qcard'), '进入单选题练习');
  ok(q('.qcard').getAttribute('data-qid') === 'lx1-1', '从第一题开始',
    q('.qcard').getAttribute('data-qid'));
  ok(txt('.qcard .qmeta').indexOf('2 分') > 0, '题头标着 2 分', txt('.qcard .qmeta'));
  const opts = qa('.qcard .option');
  ok(opts.length === 4, '四个选项', opts.length);
  click(opts[2]);   // C, 正确答案是 B
  ok(txt('.qcard .feedback').indexOf('正确答案是 B') >= 0, '判错并回显正确答案',
    txt('.qcard .feedback'));
  click('[data-action="exit-session"]');

  /* ---------- 5. 填空题: 写答案 -> 自评 -> 给参考答案 ---------- */
  click('[data-action="goto-practice"]');
  click('[data-scope="type:blank"]');
  const c2 = q('.qcard');
  ok(c2.getAttribute('data-qid') === 'lx2-1', '填空题从第一题开始', c2.getAttribute('data-qid'));
  ok(!c2.querySelector('.option'), '填空题没有选项按钮');
  ok(!c2.querySelector('.tl-source'), '填空题没有"原文"框 (没有原文可给)');
  const ta = c2.querySelector('#tl-input');
  ok(!!ta, '有写答案的输入框');
  ok(ta.placeholder === '写出你的答案...', '提示语是"写出你的答案"', ta.placeholder);
  ok(txt('#tl-ok') === '我答对了 (+2 分)', '按钮写的是"我答对了"', txt('#tl-ok'));
  ok(q('#tl-ok').disabled && q('#tl-bad').disabled, '没写字之前判不了');
  ok(!c2.querySelector('.tl-ref'), '没判之前不给参考答案');
  typeInto(ta, '数据');
  ok(!q('#tl-ok').disabled, '写了字就能判');
  click('#tl-ok');
  ok(txt('.qcard .feedback') === '✓ 自评正确', '判对给个"自评正确"', txt('.qcard .feedback'));
  ok(txt('.qcard .tl-ref-head') === '参考答案', '判完给的是"参考答案"', txt('.qcard .tl-ref-head'));
  ok(txt('.qcard .tl-ref p') === '数据', '参考答案的内容', txt('.qcard .tl-ref p'));

  /* ---------- 6. 填空题: 判错进错题本, 参考答案照给 ---------- */
  click('[data-action="next"]');
  ok(q('.qcard').getAttribute('data-qid') === 'lx2-2', '翻到填空题第 2 题',
    q('.qcard').getAttribute('data-qid'));
  typeInto(q('.qcard #tl-input'), '时间');
  click('#tl-bad');
  ok(txt('.qcard .feedback') === '✗ 自评错误, 已记入错题本', '判错提示', txt('.qcard .feedback'));
  ok(txt('.qcard .tl-ref p') === '时间、空间', '判错也给参考答案', txt('.qcard .tl-ref p'));
  click('[data-action="exit-session"]');

  /* ---------- 7. 名词解释: 每题 6 分, 做满一整套到成绩单 ---------- */
  click('[data-action="goto-practice"]');
  click('[data-scope="type:term"]');
  ok(txt('.qcard .qmeta').indexOf('6 分') > 0, '名词解释每题 6 分', txt('.qcard .qmeta'));
  ok(txt('#tl-ok') === '我答对了 (+6 分)', '按钮上的分跟着题型走', txt('#tl-ok'));
  let allCards = true;
  for (let i = 0; i < 10; i++) {
    const card = q('.qcard');
    if (!card) { allCards = false; break; }
    typeInto(card.querySelector('#tl-input'), '我写的第 ' + (i + 1) + ' 个名词解释');
    click(i === 0 ? '#tl-bad' : '#tl-ok');
    if (i < 9) click('[data-action="next"]');
  }
  ok(allCards && q('.qcard').getAttribute('data-qid') === 'lx3-10', '十道名词解释逐题翻完',
    q('.qcard') && q('.qcard').getAttribute('data-qid'));
  ok(!!q('[data-action="finish-practice"]'), '最后一题给出"完成练习"');
  click('[data-action="finish-practice"]');

  ok(!!q('.score-card'), '练习结束有成绩单');
  ok(!q('.score-types'), '练习成绩单不按题型拆对错 (那是模拟考试那页的事)');
  const w1 = qa('.review-item')[0];
  ok(!!w1 && w1.textContent.indexOf('逻辑结构') >= 0, '回顾里第一条就是刚答错的那道',
    w1 && w1.textContent.slice(0, 30));
  ok(!!w1 && w1.textContent.indexOf('你的答案: 我写的第 1 个名词解释') >= 0, '回顾里回显我写的答案',
    w1 && w1.textContent.slice(0, 60));
  ok(!!w1 && w1.textContent.indexOf('参考答案: ') >= 0, '回顾里给出参考答案');

  /* ---------- 8. 错题本: 三道题, 隔离在数据结构这边 ---------- */
  click('[data-action="home"]');
  ok(stat(1) === '3', '三道错题都进了错题本 (单选/填空/名词解释各一)', stat(1));
  click('[data-action="open-wrongbook"]');
  const items = qa('.review-item');
  ok(items.length === 3, '错题本三题', items.length);
  const single = items.filter(function (x) { return x.textContent.indexOf('正确答案: ') >= 0; })[0];
  ok(!!single && single.textContent.indexOf('上次: ') >= 0, '选择题错题照旧给"正确答案"和"上次"');
  const blank = items.filter(function (x) { return x.textContent.indexOf('时间、空间') >= 0; })[0];
  ok(!!blank, '填空题错题在错题本里');
  ok(!!blank && blank.textContent.indexOf('参考答案: 时间、空间') >= 0, '错题本给参考答案',
    blank && blank.textContent.slice(0, 60));
  const term = items.filter(function (x) { return x.textContent.indexOf('逻辑结构') >= 0; })[0];
  ok(!!term && term.textContent.indexOf('参考答案: ') >= 0, '名词解释错题也给参考答案');
  ok(!!term && term.textContent.indexOf('正确答案') < 0 && term.textContent.indexOf('上次') < 0,
    '文字题错题不说"正确答案"/"上次"');

  /* ---------- 9. 英语一点没受影响 ---------- */
  click('[data-action="home"]');
  click('[data-subject="english"]');
  ok(txt('.hero h1') === '英语刷题', '切回英语', txt('.hero h1'));
  ok(txt('.hero p') === '单选题 / 阅读理解 / 单句翻译 · 共 104 题 · 满分 180 分',
    '英语题库没被带跑', txt('.hero p'));
  ok(stat(0) === '104' && stat(1) === '0', '英语错题本没被数据结构污染',
    stat(0) + '/' + stat(1));
  ok(!!q('[data-action="start-exam"]'), '英语的模拟考试入口还在');

  } catch (err) {
    ok(false, '用例执行没抛异常', err && (err.message + ' | ' + String(err.stack || '').split('\n')[1]));
  }

  /* ---------- 结果 ---------- */
  out.unshift('共 ' + (pass + fail) + ' 条, 通过 ' + pass + ', 失败 ' + fail);
  const pre = document.createElement('pre');
  pre.id = 'out';
  pre.textContent = out.join('\n');
  document.body.appendChild(pre);
})();
</script>
</body>
</html>
